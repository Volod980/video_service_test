[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# No startCommand here — Dockerfile CMD uses "sh -c" which properly expands ${PORT:-8000}.
# Defining startCommand in railway.toml runs uvicorn directly (no shell), so $PORT
# would be passed as a literal string instead of being substituted.
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[environments.production.deploy]
numReplicas = 1
